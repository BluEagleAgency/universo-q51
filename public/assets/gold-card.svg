<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGoldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2311"/>
      <stop offset="35%" stop-color="#18140C"/>
      <stop offset="100%" stop-color="#0E0C07"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="25%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="75%" stop-color="#9C792E"/>
      <stop offset="100%" stop-color="#6E5118"/>
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="10" y="10" width="520" height="300" rx="20" fill="url(#cardGoldBase)" stroke="url(#goldSheen)" stroke-width="2.5"/>

  <!-- Micro-security Pattern -->
  <g opacity="0.12" stroke="url(#goldSheen)" stroke-width="0.7">
    <circle cx="270" cy="160" r="130" fill="none"/>
    <circle cx="270" cy="160" r="100" fill="none" stroke-dasharray="2 4"/>
    <circle cx="270" cy="160" r="70" fill="none"/>
    <line x1="20" y1="60" x2="520" y2="60"/>
    <line x1="20" y1="260" x2="520" y2="260"/>
  </g>

  <!-- Golden Chip / Central Emblem -->
  <g transform="translate(45, 115)">
    <rect width="60" height="48" rx="8" fill="#1B170E" stroke="url(#goldSheen)" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="20" y2="48" stroke="url(#goldSheen)" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="48" stroke="url(#goldSheen)" stroke-width="1"/>
    <line x1="0" y1="24" x2="60" y2="24" stroke="url(#goldSheen)" stroke-width="1"/>
    <circle cx="30" cy="24" r="5" fill="url(#goldSheen)"/>
  </g>

  <!-- Top Metadata -->
  <text x="45" y="48" fill="url(#goldSheen)" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="4">UNIVERSO Q51 • KEY 1 OF 5</text>
  <text x="495" y="48" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.6" text-anchor="end">#Q51-GOLD-003</text>

  <!-- Card Center Title -->
  <text x="270" y="145" fill="url(#goldSheen)" font-family="'Cinzel', serif" font-size="24" font-weight="700" letter-spacing="5" text-anchor="middle" filter="url(#goldGlow)">CHAVE DOURADA</text>
  <text x="270" y="175" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="500" letter-spacing="3" text-anchor="middle" opacity="0.9">ESTATUTO VITALÍCIO DE FUNDADOR</text>
  <text x="270" y="200" fill="#DFC285" font-family="'Inter', sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle" opacity="0.75">LIVRARIA LEITURA DEL REY • 21.11.2026</text>

  <!-- Bottom Metadata -->
  <text x="45" y="285" fill="#A79A7E" font-family="'Space Grotesk', sans-serif" font-size="11" letter-spacing="2">TITULAR: FUNDADOR CANÔNICO</text>
  <text x="495" y="285" fill="url(#goldSheen)" font-family="'Cinzel', serif" font-size="13" font-weight="600" letter-spacing="3" text-anchor="end">NOAH ARCO</text>
</svg>
