<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <radialGradient id="nidesCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#C5A059" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#020205" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldVectorLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#7A5C1E"/>
    </linearGradient>
  </defs>

  <!-- Pitch Black Minimalist Plate -->
  <rect width="400" height="560" rx="8" fill="#04060A" stroke="rgba(197, 160, 89, 0.35)" stroke-width="1.2"/>
  
  <!-- Subtle Grid lines (Precision Delos / Westworld aesthetic) -->
  <g opacity="0.08" stroke="#C5A059" stroke-width="0.8">
    <line x1="20" y1="80" x2="380" y2="80"/>
    <line x1="20" y1="460" x2="380" y2="460"/>
    <line x1="80" y1="20" x2="80" y2="540"/>
    <line x1="320" y1="20" x2="320" y2="540"/>
  </g>

  <!-- Corner Precision Accents -->
  <path d="M 12 24 L 24 24 M 24 12 L 24 24" stroke="#C5A059" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 388 24 L 376 24 M 376 12 L 376 24" stroke="#C5A059" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 12 536 L 24 536 M 24 548 L 24 536" stroke="#C5A059" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 388 536 L 376 536 M 376 548 L 376 536" stroke="#C5A059" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Status Eyebrow: EM CONSTRUÇÃO -->
  <g transform="translate(115, 38)">
    <rect width="170" height="24" rx="3" fill="rgba(197, 160, 89, 0.08)" stroke="rgba(197, 160, 89, 0.4)" stroke-width="0.8"/>
    <circle cx="14" cy="12" r="3" fill="#E5C77A"/>
    <text x="26" y="15" fill="#E5C77A" font-family="'Space Grotesk', monospace, sans-serif" font-size="9" font-weight="700" letter-spacing="2">EM CONSTRUÇÃO</text>
  </g>

  <!-- Central Ambient Glow -->
  <circle cx="200" cy="245" r="140" fill="url(#nidesCore)"/>

  <!-- CENTRAL GOLD VECTOR GLYPH: The Quintessence / Converging 5 Vectors -->
  <g id="nides-central-glyph" transform="translate(200, 245)">
    <!-- Outer concentric orbital rings -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#goldVectorLine)" stroke-width="0.8" opacity="0.4" stroke-dasharray="3 5"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="url(#goldVectorLine)" stroke-width="1.2" opacity="0.75"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#goldVectorLine)" stroke-width="0.8" opacity="0.5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#goldVectorLine)" stroke-width="1.4" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#FFF2B2"/>

    <!-- 5 Radial Convergence Axes (The 5 Minds / Quintessence) -->
    <g stroke="url(#goldVectorLine)" stroke-width="1.2" opacity="0.85">
      <!-- 72 deg increments -->
      <line x1="0" y1="0" x2="0" y2="-75"/>
      <line x1="0" y1="0" x2="71.3" y2="-23.2"/>
      <line x1="0" y1="0" x2="44.1" y2="60.7"/>
      <line x1="0" y1="0" x2="-44.1" y2="60.7"/>
      <line x1="0" y1="0" x2="-71.3" y2="-23.2"/>
    </g>

    <!-- Geometric Diamond Intersections -->
    <polygon points="0,-62 58.9,-19.1 36.4,50.1 -36.4,50.1 -58.9,-19.1" fill="none" stroke="url(#goldVectorLine)" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Classification Labels -->
  <text x="200" y="380" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', monospace" font-size="9" font-weight="600" letter-spacing="4" text-anchor="middle">LIVRO III · CÂNONE EM EXPANSÃO</text>
  
  <text x="200" y="415" fill="#FFFFFF" font-family="'Syncopate', sans-serif" font-size="20" font-weight="700" letter-spacing="4" text-anchor="middle">REGISTROS</text>
  <text x="200" y="440" fill="url(#goldVectorLine)" font-family="'Syncopate', sans-serif" font-size="16" font-weight="700" letter-spacing="6" text-anchor="middle">DE NIDES</text>

  <!-- Early Access Badge & Signature -->
  <line x1="100" y1="480" x2="300" y2="480" stroke="rgba(197, 160, 89, 0.25)" stroke-width="1"/>
  <text x="200" y="505" fill="#E5C77A" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" letter-spacing="2" text-anchor="middle">ACESSO DIGITAL ANTECIPADO 2027</text>
  <text x="200" y="525" fill="rgba(255,255,255,0.45)" font-family="'Space Grotesk', monospace" font-size="9" letter-spacing="1.5" text-anchor="middle">INCLUSO NO PASSE DE FUNDADOR</text>
</svg>
